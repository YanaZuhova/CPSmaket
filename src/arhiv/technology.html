<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Default slider two</title>
        <link rel="stylesheet" href="normalize.css" />
        <link rel="stylesheet" href="reset.css" />
        <link rel="stylesheet" href="swiper.min.css" />
        <link rel="stylesheet" href="technology.css" />
    </head>
    <body>
        <header class="header">
            <h1 class="title">Ремонт различных видов техники</h1>
        </header>
        <main class="main">
            <div class="slider-container">
                <div class="swiper-container">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide card">
                            <a href="#" class="card__type">
                                <p class="card__type" >Ремонт ноутбуков </p>
                                <img class="card__img" src="swiper-icons/goNext.svg" />
                            </a>
                        </div>
                        <div class="swiper-slide card">
							<a href="#" class="card__type">
                                <p class="card__text">Ремонт планшетов </p>
                                <img class="card__img" src="swiper-icons/goNext.svg" />
                            </a>
						</div>
                        <div class="swiper-slide card">
							<a href="#" class="card__type">
                                <p class="card__text">Ремонт ПК </p>
                                <img class="card__img" src="swiper-icons/goNext.svg" />
                            </a>
						</div>
                        <div class="swiper-slide card">
							<a href="#" class="card__type">
                                <p class="card__text">Ремонт мониторов </p>
                                <img class="card__img" src="swiper-icons/goNext.svg" />
                            </a>
						</div>
						<div class="swiper-slide card">
							<a href="#" class="card__type">
                                <p class="card__text">Ремонт телефонов </p>
                                <img class="card__img" src="swiper-icons/goNext.svg" />
                            </a>
						</div>
						<div class="swiper-slide card">
							<a href="#" class="card__type">
                                <p class="card__text">Ремонт часов </p>
                                <img class="card__img" src="swiper-icons/goNext.svg" />
                            </a>
						</div>
                    </div>
                    <div class="swiper-pagination"></div>
                    <!-- <button class="swiper-button-prev"></button>
                    <button class="swiper-button-next"></button> -->
                </div>
            </div>

            <section class="section">
                <div class="section__card">
                    <a href="#" class="card__type">
                        <p class="card__text">Ремонт ноутбуков </p>
                        <img class="card__img" src="swiper-icons/goNext.svg" />
                    </a>
                </div>
                <div class="section__card">
                    <a href="#" class="card__type">
                        <p class="card__text">Ремонт планшетов </p>
                        <img class="card__img" src="swiper-icons/goNext.svg" />
                    </a>
                </div>
                <div class="section__card">
                    <a href="#" class="card__type">
                        <p class="card__text">Ремонт ПК </p>
                        <img class="card__img" src="swiper-icons/goNext.svg" />
                    </a>
                </div>

                <div class="section__card for--large">
                    <a href="#" class="card__type">
                        <p class="card__text">Ремонт мониторов </p>
                        <img class="card__img" src="swiper-icons/goNext.svg" />
                    </a>
                </div>
                

            </section>
            <div class="section--interval"></div>
            <section class="section modal">
                <div class="section__card for--middle">
                    <a href="#" class="card__type">
                        <p class="card__text">Ремонт мониторов </p>
                        <img class="card__img" src="swiper-icons/goNext.svg" />
                    </a>
                </div>
                <div class="section__card">
                    <a href="#" class="card__type">
                        <p class="card__text">Ремонт телефонов </p>
                        <img class="card__img" src="swiper-icons/goNext.svg" />
                    </a>
                </div>
                <div class="section__card">
                    <a href="#" class="card__type">
                        <p class="card__text">Ремонт часов </p>
                        <img class="card__img" src="swiper-icons/goNext.svg" />
                    </a>
                </div>
            </section>
            <button class="btn">
                <div class="btn--down"></div>
                <p class="btn--text">Показать все</p>
            </button>
        </main>
        <script src="swiper.min.js"></script>
        <script src="technology.js"></script>
        <script src="btnevent.js"></script>
    </body>
</html>
